<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منصة التأشيرات (نسخة اختبار)</title></head><body>
<!-- نسخة مبسّطة بأرقام وهمية من صفحة «التفويض على تأشيرة» (visa.mofa.gov.sa/enjaz/getvisainformation/person): نفس الـ ids. للاختبار بس. -->
<form action="/enjaz/ViewVisaDetails/person" method="post">
 <div class="form-group"><label class="control-label col-md-2 tr_land">رقم الصادر </label><div class="col-md-3"><input type="text" name="VisaNumber" id="VisaNumber" digits="true" class="form-control required"></div>
  <label class="control-label col-md-2">جهة القدوم </label><div class="col-md-3"><select class="required select2me" id="Embassy" name="Embassy"><option value="311">ابوجا</option><option value="302">القاهرة</option><option value="320">السويس</option><option value="321">الاسكندرية</option></select></div></div>
 <div class="form-group"><label class="control-label col-md-2 tr_land">رقم السجل </label><div class="col-md-3"><input type="text" name="SponserID" id="SponserID" digits="true" class="form-control required"></div>
  <label class="control-label col-md-2">رمز الصورة</label><div class="col-md-3"><input type="text" class="form-control required hasCaptcha fake" id="Captcha" name="Captcha" maxlength="6" autocomplete="off"></div></div>
 <button type="submit" name="VisaInformation" class="btn green">بحث</button>
</form></body></html>
