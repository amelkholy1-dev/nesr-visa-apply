<!DOCTYPE html>

<html lang="en" dir="ltr"><head><meta charset="UTF-8"><title>Wafid | وافد</title></head>

<div class="ui vertical basic segment medical-status-search" dir="ltr"><div class="ui container container-dashboard"><h1>Your Medical Examinations Results</h1>

</div></div></form></div></div></div></div>
<!--RESULT-->
</main>
