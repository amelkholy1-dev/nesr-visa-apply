<form action="/enjaz/ViewVisaDetails/person" method="post">
 <div class="form-group"><label class="col-md-2 control-label"> رقم الصادر </label><div class="col-md-3 control-display-label"> 1000000001 </div><label class="control-label col-md-2"> تاريخ التأشيرة </label><div class="col-md-3 control-display-label"> 1447/09/25 </div></div>
