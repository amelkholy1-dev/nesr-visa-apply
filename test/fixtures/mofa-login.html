<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>منصة التأشيرات (نسخة اختبار)</title></head><body>
<!-- نسخة مبسّطة (تخمين لشكل صفحة دخول الشركات، مش محفوظة من المنصة) للاختبار بس -->
<div class="page-header"><div class="dropdown header-login"><a>الدخول</a></div></div>
<form action="/Account/Login/enjazcompany" method="post">
<!--ERR-->
<label>اسم المستخدم</label><input type="text" id="UserName" name="UserName">
<label>كلمة المرور</label><input type="password" id="Password" name="Password">
<label>رمز الصورة</label><img id="imgCaptcha" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEElEQVR42mNk+M9QzwAEAAyJAf9JlwVPAAAAAElFTkSuQmCC" width="120" height="40"><a id="btnRefreshCaptcha" href="javascript:void(0)" onclick="document.getElementById('imgCaptcha').src=document.getElementById('imgCaptcha').src.split('#')[0]+'#'+Date.now()">تحديث</a>

<button type="submit">دخول</button>
</form></body></html>
