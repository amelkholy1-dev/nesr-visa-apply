<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنجاز — نظام إدارة التأشيرات</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="skins.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>(function () { try { var l = JSON.parse(localStorage.getItem('look') || '{}'); var r = document.documentElement; r.setAttribute('data-skin', l.skin === 'olive' ? 'olive' : 'petrol'); if (l.dark) r.setAttribute('data-mode', 'dark'); if (l.skin === 'olive') document.querySelector('link[rel=icon]').href = 'logo-olive.svg'; } catch (e) { document.documentElement.setAttribute('data-skin', 'petrol'); } })();</script>
</head>
<body>
  <aside id="top" class="sidebar" hidden>
    <div class="sb-head">
      <a class="brand" href="#/"><span class="logo">إ</span><span class="bt"><b id="brandName">إنجاز</b><small id="brandTag">نظام إدارة التأشيرات</small></span></a>
      <button class="sb-col" id="sbCol" type="button" title="تصغير / تكبير القايمة"></button>
    </div>
    <div class="sb-hist"><button type="button" id="navBack" class="sb-btn">رجوع</button><button type="button" id="navFwd" class="sb-btn">عودة</button></div>
    <div class="sb-search"><input id="navQ" type="search" placeholder="ابحث عن شاشة..." autocomplete="off"></div>
    <nav id="nav"></nav>
    <div class="who">
      <span id="extState" class="pill" title="حالة إضافة Chrome"></span>
      <div class="me"><span class="av" id="whoAv"></span><span class="mn"><span id="whoName"></span><small id="whoRole"></small></span><button id="logoutBtn" class="sb-out" type="button" title="خروج">خروج</button></div>
    </div>
  </aside>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="icons.js"></script>
  <script src="mrz-ocr.js"></script>
  <script src="pages-dashboard.js"></script>
  <script src="pages-people.js"></script>
  <script src="pages-admin.js"></script>
  <script src="appno.js"></script>
  <script src="photo.js"></script>
  <script src="print.js"></script>
  <script src="netprint.js"></script>
  <script src="pages-accounts.js"></script>
  <script src="pages-treasury.js"></script>
  <script src="pages-gemini.js"></script>
  <script src="pages-templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
